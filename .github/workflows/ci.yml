name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 数学核心测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 运行测试
        run: node tests/math.test.mjs

  offline:
    name: 单文件零依赖承诺
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: 不得引用任何外部资源
        run: |
          # 这个页面的卖点是「下载 index.html 双击就能离线用」。
          # 一旦有人加了 CDN 或外部字体，承诺就破了，用户断网打不开。
          cat > /tmp/check.py <<'PY'
          import re, sys
          html = open("index.html", encoding="utf-8").read()

          problems = []

          # 外部脚本 / 样式 / 字体 / 图片
          for pat, what in [
              (r'<script[^>]+\bsrc\s*=', '外部 script src'),
              (r'<link[^>]+\bhref\s*=\s*["\']https?://', '外部样式表或字体'),
              (r'<img[^>]+\bsrc\s*=\s*["\']https?://', '外部图片'),
              (r'@import\s+url\(\s*["\']?https?://', 'CSS @import 外部'),
              (r'url\(\s*["\']?https?://', 'CSS url() 外部资源'),
          ]:
              for m in re.finditer(pat, html, re.I):
                  line = html[:m.start()].count("\n") + 1
                  problems.append(f"  L{line}: {what} → {m.group(0)[:60]}")

          # 运行时联网
          for pat, what in [
              (r'\bfetch\s*\(', 'fetch 调用'),
              (r'XMLHttpRequest', 'XMLHttpRequest'),
              (r'new\s+WebSocket', 'WebSocket'),
              (r'\.src\s*=\s*["\']https?://', '动态设置的远程 src'),
          ]:
              for m in re.finditer(pat, html, re.I):
                  line = html[:m.start()].count("\n") + 1
                  problems.append(f"  L{line}: {what}")

          if problems:
              print("::error::index.html 不再自包含，离线可用性被破坏")
              print("\n".join(problems))
              sys.exit(1)

          print("index.html 完全自包含：无外部资源、无联网调用 ✓")
          print(f"  文件大小 {len(html.encode('utf-8')) / 1024:.1f} KB")
          PY
          python3 /tmp/check.py

      - name: 确认测试覆盖的是真实源码
        run: |
          # 测试通过从 index.html 里切代码来跑，这里确认那个切取点还在，
          # 否则测试会因为找不到标记而失败——但报错信息可能让人误解成别的问题。
          for marker in "const C=(re,im)" "function polyRoots" "const parseCoefs"; do
            if ! grep -qF "$marker" index.html; then
              echo "::error file=index.html::测试抽取依赖的标记缺失: $marker"
              exit 1
            fi
          done
          echo "测试抽取标记齐全 ✓"
